name: Historia de usuario
description: Un elemento del Product Backlog con valor para el usuario
title: "HU-XX: "
labels: ["historia"]
body:
  - type: textarea
    id: historia
    attributes:
      label: Historia
      description: Como [usuario], quiero [acción] para [beneficio].
      placeholder: Como vecina, quiero ... para ...
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Un escenario por casilla, con su nombre en negrita. Formato Dado / Cuando / Entonces.
      value: |
        - [ ] **Nombre del escenario.** Dado ... cuando ... entonces ...
  - type: textarea
    id: lista
    attributes:
      label: Lista para construir
      description: Definición de Terminado de la fase de Exploración.
      value: |
        - [ ] Criterios verificables, revisados por otra pareja
        - [ ] Pantalla en el prototipo de Figma (semana 5)
        - [ ] Validada con un usuario real (INV-02)
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad (MoSCoW)
      options: [Must, Should, Could]
    validations:
      required: true
  - type: textarea
    id: notas
    attributes:
      label: Notas técnicas o dudas
