name: eco_reporte
description: Reporte ciudadano de puntos críticos de residuos (ODS 11, Barrancabermeja). Proyecto modelo del curso DAM · UNIPAZ.
publish_to: 'none'
version: 1.1.0+5

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.1        # widgets de Material 3 (fuera del SDK desde Flutter 3.47)
  provider: ^6.1.5           # inyección de dependencias y estado (MVVM del curso)
  go_router: ^17.5.0         # navegación declarativa
  sqflite: ^2.4.3            # SQLite en el teléfono (TEC-02)
  path: ^1.9.1               # unir rutas de archivos sin errores
  image_picker: ^1.2.3       # cámara y galería (HU-01)
  path_provider: ^2.1.6      # carpeta privada de la app para las fotos (HU-03)
  geolocator: ^14.0.3        # ubicación del punto, solo en primer plano (HU-02)
  share_plus: ^13.3.0        # menú de compartir del sistema (HU-10)
  shared_preferences: ^2.5.5 # recordar que se leyó el aviso de privacidad (TEC-05)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0 # SQLite en el computador, para flutter test

flutter:
  uses-material-design: true
